[pytest]
minversion = 7.0
pythonpath = src .
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

markers =
    network: mark test as part of overall network test suite
    ping: mark test as ICMP ping test case
    tcp: mark test as TCP connection test case
    port: mark test as port availability test case
    udp: mark test as UDP communication test case
    metrics: mark test as packet-loss / latency metrics test case
    performance: mark test as a performance measurement test case
    throughput: mark test as a throughput test case
    latency: mark test as a latency test case
    packet_loss: mark test as a packet-loss test case

addopts =
    --strict-markers
    -v
    --tb=short

log_cli = true
log_cli_level = INFO
log_cli_format = %(asctime)s - %(levelname)s - %(name)s - %(message)s
log_cli_date_format = %Y-%m-%d %H:%M:%S
